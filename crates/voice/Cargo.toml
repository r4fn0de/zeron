[package]
name = "zeron-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
parakeet-rs = { version = "=0.3.8", default-features = false, features = ["cpu", "api-28"] }
# Keep the nested ZGX workspace on the same native runtime as ZUI.
# Omit ort's default `copy-dylibs` feature: ort-sys 2.0.0-rc.13 assumes the
# pre-Rust-1.100 `target/<profile>/build/<pkg>-<hash>/out` layout and panics on
# Windows under Cargo 1.100's `build/<pkg>/<hash>/out` layout. Windows links the
# system DirectML/DX12 libraries and does not bundle ort dylibs.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-27"] }
ort-sys = "=2.0.0-rc.13"
cpal = "=0.17.3"
rubato = "=0.16.2"
reqwest.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

# ort-sys (ONNX Runtime, reached through parakeet-rs) publishes no prebuilt
# binary for Intel mac: ort-sys 2.0.0-rc.13 pins ONNX Runtime 1.28, and
# upstream dropped the osx-x86_64 artifacts after 1.23 (1.24+ ship osx-arm64
# only), so there is nothing for the build script to download.
#
# `load-dynamic` forwards to ort/load-dynamic -> ort-sys/disable-linking, which
# makes ort-sys's build script return before it tries to fetch a prebuilt, and
# dlopen libonnxruntime.dylib at runtime instead. Without that dylib the
# parakeet call panics inside ort's lazy API setup, but the dictation worker
# already wraps run_job in catch_unwind, so it surfaces as "Dictation stopped
# unexpectedly. Your draft is safe." and cloud dictation is unaffected.
#
# Scoped to x86_64 on purpose: the arm64 release keeps static linking against
# the prebuilt onnxruntime and local Parakeet transcription works there.
#
# `default-features = false` + the base dep's `cpu`/`api-28`: the base dep
# disables parakeet's defaults (which pull ort/default's copy-dylibs), and a
# target dep without it would silently turn them back on for Intel.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
parakeet-rs = { version = "=0.3.8", default-features = false, features = ["cpu", "api-28", "load-dynamic"] }

[dev-dependencies]
hound = "3.5"
tempfile.workspace = true
